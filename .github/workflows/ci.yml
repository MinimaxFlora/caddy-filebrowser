name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild browse.html
        run: python3 -I build-template.py

      - name: Generated file is up to date
        run: git diff --exit-code -- browse.html

      - name: Template markers
        run: |
          grep -q 'fb-readme' browse.html
          grep -q 'data-fb-close' browse.html
          grep -q "connect-src 'self'" browse.html
          grep -q 'highlight.min.js' build-template.py
          test -s assets/highlight.min.js
          test -s assets/marked.min.js
          test -s assets/purify.min.js

      - name: Validate stock file_server config
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            caddy:2.11.9 \
            validate --config testdata/Caddyfile --adapter caddyfile
