name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7

      - name: Build with Caddy
        run: xcaddy build v2.11.9 --with github.com/MinimaxFlora/caddy-filebrowser=.

      - name: Verify module and Caddyfile
        run: |
          ./caddy list-modules | grep -qx 'http.handlers.filebrowser'
          ./caddy validate --config testdata/Caddyfile --adapter caddyfile
